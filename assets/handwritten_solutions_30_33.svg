<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
<style>
  .hand { font-family: "Comic Sans MS", "Trebuchet MS", "DejaVu Sans", sans-serif; font-variant-ligatures:none; }
  .print { font-family: "DejaVu Sans", Arial, sans-serif; }
  text { dominant-baseline: alphabetic; }
</style>
<rect width="100%" height="100%" fill="white"/>

<line x1="297" y1="50" x2="297" y2="803" stroke="#e5e5e5" stroke-width="1" stroke-linecap="round"/>
<line x1="0" y1="50" x2="595" y2="50" stroke="#eeeeee" stroke-width="1" stroke-linecap="round"/>
<line x1="0" y1="803" x2="595" y2="803" stroke="#f2f2f2" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="39" class="print" font-size="11" font-weight="700" fill="#222">mock CSAT math / annotated</text>
<text x="290" y="825" class="print" font-size="11" font-weight="400" fill="#222">09</text>
<text x="42" y="100" class="hand" font-size="24" font-weight="700" fill="#eb2065">30</text>
<text x="75" y="97" class="hand" font-size="12" font-weight="400" fill="#333">A²=B,  ab=0,  a+b≤0</text>
<rect x="76" y="116" width="60" height="22" rx="7" fill="#c6e1ff" stroke="#c6e1ff" stroke-width="1.5"/>
<text x="84" y="132" class="hand" font-size="13" font-weight="700" fill="#222">ab=0</text>
<rect x="146" y="116" width="86" height="22" rx="7" fill="#ffcdda" stroke="#ffcdda" stroke-width="1.5"/>
<text x="154" y="132" class="hand" font-size="13" font-weight="700" fill="#222">a+b≤0</text>
<rect x="78" y="168" width="178" height="24" rx="7" fill="#d2f2d2" stroke="#d2f2d2" stroke-width="1.5"/>
<text x="88" y="185" class="hand" font-size="13" font-weight="700" fill="#222">sum=-1, product=-8</text>
<line x1="122" y1="140" x2="68" y2="220" stroke="#1f69dc" stroke-width="1.7" stroke-linecap="round"/><polygon points="68,220 61,216 61,224" fill="#1f69dc"/>
<line x1="189" y1="140" x2="128" y2="242" stroke="#dc323c" stroke-width="1.7" stroke-linecap="round"/><polygon points="128,242 121,238 121,246" fill="#dc323c"/>
<text x="42" y="225" class="hand" font-size="14" font-weight="700" fill="#1f69dc">A²=B</text>
<text x="42" y="247" class="hand" font-size="14" font-weight="400" fill="#dc323c">a₁₂≠0,  a₁₁+a₂₂=0</text>
<text x="42" y="269" class="hand" font-size="14" font-weight="400" fill="#222">a₁₁=0  →  A=[0 a₁₂; a₂₁ 0]</text>
<rect x="42" y="286" width="188" height="25" rx="7" fill="#c6e1ff" stroke="#c6e1ff" stroke-width="1.5"/>
<text x="50" y="303" class="hand" font-size="13" font-weight="700" fill="#1f69dc">a₁₂² a₂₁² = -8</text>
<rect x="42" y="317" width="170" height="25" rx="7" fill="#ffcdda" stroke="#ffcdda" stroke-width="1.5"/>
<text x="50" y="334" class="hand" font-size="13" font-weight="700" fill="#dc323c">a₁₂ + a₂₁ = 3</text>
<text x="42" y="353" class="hand" font-size="14" font-weight="700" fill="#8246be">a₁₂³+a₂₁³</text>
<text x="42" y="375" class="hand" font-size="14" font-weight="400" fill="#222">=3³-3(-2)·3 = 45</text>
<rect x="42" y="394" width="80" height="28" rx="7" fill="#ffee80" stroke="#d7bd35" stroke-width="1.5"/>
<text x="64" y="414" class="hand" font-size="16" font-weight="700" fill="#111">45</text>
<text x="315" y="100" class="hand" font-size="24" font-weight="700" fill="#eb2065">32</text>
<text x="348" y="97" class="hand" font-size="12" font-weight="400" fill="#333">|x-k|≤5,  x²-x-12&gt;0</text>
<rect x="348" y="114" width="143" height="22" rx="7" fill="#c6e1ff" stroke="#c6e1ff" stroke-width="1.5"/>
<text x="356" y="130" class="hand" font-size="13" font-weight="700" fill="#222">k-5≤x≤k+5</text>
<rect x="348" y="144" width="120" height="22" rx="7" fill="#ffcdda" stroke="#ffcdda" stroke-width="1.5"/>
<text x="356" y="160" class="hand" font-size="13" font-weight="700" fill="#222">x&lt;-3 or x&gt;4</text>
<line x1="420" y1="138" x2="330" y2="220" stroke="#1f69dc" stroke-width="1.7" stroke-linecap="round"/><polygon points="330,220 323,216 323,224" fill="#1f69dc"/>
<line x1="410" y1="166" x2="450" y2="220" stroke="#dc323c" stroke-width="1.7" stroke-linecap="round"/><polygon points="450,220 443,216 443,224" fill="#dc323c"/>
<text x="318" y="220" class="hand" font-size="13" font-weight="400" fill="#dc323c">(i) k≤-1 : count &gt; 7  ✕</text>
<line x1="333" y1="246" x2="558" y2="246" stroke="#555" stroke-width="2" stroke-linecap="round"/>
<text x="350" y="240" class="hand" font-size="10" font-weight="400" fill="#333">-3</text>
<text x="470" y="240" class="hand" font-size="10" font-weight="400" fill="#1f69dc">k+5</text>
<rect x="398" y="232" width="72" height="14" rx="0" fill="#ffd2dc" stroke="#dc323c" stroke-width="1.5"/>
<text x="318" y="291" class="hand" font-size="13" font-weight="700" fill="#8246be">(ii) -1&lt;k&lt;2</text>
<text x="318" y="313" class="hand" font-size="12" font-weight="400" fill="#555">k=0: {-5,-4} → -4  ✕</text>
<rect x="390" y="318" width="64" height="16" rx="0" fill="#ffd2dc" stroke="#dc323c" stroke-width="1.5"/>
<text x="318" y="333" class="hand" font-size="12" font-weight="700" fill="#269650">k=1: {-4,5,6} → 7  ○</text>
<text x="318" y="363" class="hand" font-size="13" font-weight="400" fill="#dc323c">(iii) k≥2 : count &gt; 7  ✕</text>
<rect x="326" y="393" width="82" height="28" rx="7" fill="#ffee80" stroke="#d7bd35" stroke-width="1.5"/>
<text x="344" y="413" class="hand" font-size="15" font-weight="700" fill="#111">k=1</text>
<text x="430" y="413" class="hand" font-size="13" font-weight="700" fill="#269650">answer ④</text>
<text x="42" y="452" class="hand" font-size="24" font-weight="700" fill="#eb2065">31</text>
<text x="75" y="449" class="hand" font-size="12" font-weight="400" fill="#333">x²+3x-10&lt;0,  ax≥a²</text>
<rect x="75" y="467" width="82" height="22" rx="7" fill="#c6e1ff" stroke="#c6e1ff" stroke-width="1.5"/>
<text x="86" y="483" class="hand" font-size="13" font-weight="700" fill="#222">-5&lt;x&lt;2</text>
<rect x="168" y="467" width="92" height="22" rx="7" fill="#ffcdda" stroke="#ffcdda" stroke-width="1.5"/>
<text x="177" y="483" class="hand" font-size="13" font-weight="700" fill="#222">4 integers</text>
<text x="42" y="525" class="hand" font-size="13" font-weight="400" fill="#1f69dc">x=-4,-3,-2,-1,0,1  (6)</text>
<text x="42" y="548" class="hand" font-size="13" font-weight="400" fill="#dc323c">a=0 → 6  ✕</text>
<text x="42" y="571" class="hand" font-size="13" font-weight="400" fill="#dc323c">a&gt;0 → x≥a : 0 or 1  ✕</text>
<text x="42" y="594" class="hand" font-size="13" font-weight="700" fill="#8246be">a&lt;0 → x≤a</text>
<rect x="42" y="601" width="190" height="26" rx="7" fill="#ffcdda" stroke="#ffcdda" stroke-width="1.5"/>
<text x="52" y="619" class="hand" font-size="13" font-weight="700" fill="#222">need -4,-3,-2,-1</text>
<text x="42" y="651" class="hand" font-size="13" font-weight="400" fill="#222">⌊a⌋=-1  →  -1≤a&lt;0</text>
<rect x="42" y="667" width="126" height="28" rx="7" fill="#ffee80" stroke="#d7bd35" stroke-width="1.5"/>
<text x="54" y="688" class="hand" font-size="15" font-weight="700" fill="#111">a=-1  (②)</text>
<text x="315" y="452" class="hand" font-size="24" font-weight="700" fill="#eb2065">33</text>
<text x="348" y="449" class="hand" font-size="10" font-weight="400" fill="#333">a&lt;0,  (x-a)²&lt;a²,  x²+ax&lt;(a+1)x</text>
<rect x="348" y="467" width="82" height="22" rx="7" fill="#c6e1ff" stroke="#c6e1ff" stroke-width="1.5"/>
<text x="358" y="483" class="hand" font-size="13" font-weight="700" fill="#222">2a&lt;x&lt;0</text>
<rect x="440" y="467" width="70" height="22" rx="7" fill="#ffcdda" stroke="#ffcdda" stroke-width="1.5"/>
<text x="449" y="483" class="hand" font-size="13" font-weight="700" fill="#222">a&lt;x&lt;1</text>
<text x="318" y="525" class="hand" font-size="13" font-weight="400" fill="#1f69dc">(x-a)²&lt;a²</text>
<text x="318" y="548" class="hand" font-size="13" font-weight="400" fill="#1f69dc">x(x-2a)&lt;0 → 2a&lt;x&lt;0</text>
<text x="318" y="571" class="hand" font-size="13" font-weight="400" fill="#8246be">x²+ax&lt;(a+1)x</text>
<text x="318" y="594" class="hand" font-size="13" font-weight="400" fill="#8246be">(x-1)(x-a)&lt;0 → a&lt;x&lt;1</text>
<line x1="328" y1="639" x2="563" y2="639" stroke="#444" stroke-width="2" stroke-linecap="round"/>
<text x="357" y="659" class="hand" font-size="10" font-weight="400" fill="#1f69dc">2a</text>
<text x="410" y="659" class="hand" font-size="10" font-weight="400" fill="#8246be">a</text>
<text x="463" y="659" class="hand" font-size="10" font-weight="400" fill="#dc323c">0</text>
<text x="523" y="659" class="hand" font-size="10" font-weight="400" fill="#269650">1</text>
<rect x="410" y="621" width="53" height="13" rx="0" fill="#c6e1ff" stroke="#1f69dc" stroke-width="1.5"/>
<text x="318" y="694" class="hand" font-size="14" font-weight="700" fill="#269650">common:  a&lt;x&lt;0</text>
<text x="318" y="719" class="hand" font-size="13" font-weight="400" fill="#222">b=a,  b+1=0</text>
<text x="318" y="742" class="hand" font-size="13" font-weight="400" fill="#222">a=-1, b=-1</text>
<rect x="318" y="759" width="126" height="28" rx="7" fill="#ffee80" stroke="#d7bd35" stroke-width="1.5"/>
<text x="328" y="780" class="hand" font-size="15" font-weight="700" fill="#111">a+b=-2  (⑤)</text>
</svg>